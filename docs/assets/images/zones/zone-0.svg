<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 85" width="140" height="85" role="img" aria-label="NumPy Launchpad Zone Emblem">
  <defs>
    <filter id="glow-0" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow-0" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Background Plaque -->
  <rect x="4" y="4" width="132" height="77" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="#06b6d4" stroke-width="1.8" filter="url(#glow-0)"/>
  <!-- Top Accent Indicator -->
  <rect x="14" y="4" width="112" height="3" rx="1.5" fill="#22d3ee"/>

  <!-- Thematic Zone Artwork -->
  
            <!-- 3D Tensor Grid & Array Cube -->
            <path d="M 30,55 L 60,38 L 90,55 L 60,72 Z" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" stroke-width="1.8"/>
            <path d="M 30,55 L 30,35 L 60,18 L 60,38 Z" fill="rgba(6, 182, 212, 0.4)" stroke="#06b6d4" stroke-width="1.8"/>
            <path d="M 60,38 L 60,18 L 90,35 L 90,55 Z" fill="rgba(6, 182, 212, 0.55)" stroke="#06b6d4" stroke-width="1.8"/>
            <!-- Grid lines -->
            <line x1="45" y1="46" x2="75" y2="28" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="2 2"/>
            <line x1="45" y1="26" x2="75" y2="44" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="2 2"/>
            <!-- Prompt Chevron -->
            <path d="M 100,32 L 108,40 L 100,48" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M 108,32 L 116,40 L 108,48" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
        
</svg>
