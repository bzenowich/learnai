<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 85" width="140" height="85" role="img" aria-label="Vector & Matrix Plains Zone Emblem">
  <defs>
    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow-1" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background Plaque -->
  <rect x="4" y="4" width="132" height="77" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="#10b981" stroke-width="1.8" filter="url(#glow-1)"/>
  <!-- Top Accent Indicator -->
  <rect x="14" y="4" width="112" height="3" rx="1.5" fill="#34d399"/>

  <!-- Thematic Zone Artwork -->
  
            <!-- 3D Coordinate Arrows & Dot Product Spark -->
            <line x1="30" y1="65" x2="75" y2="65" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-1)"/>
            <line x1="30" y1="65" x2="30" y2="20" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-1)"/>
            <line x1="30" y1="65" x2="65" y2="35" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-1)"/>
            <!-- Vector Projection Arc -->
            <path d="M 55,65 A 25 25 0 0 0 52,46" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2"/>
            <!-- Neuron Synapse Node -->
            <circle cx="95" cy="40" r="14" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="2"/>
            <circle cx="95" cy="40" r="6" fill="#34d399"/>
            <line x1="65" y1="35" x2="89" y2="39" stroke="#34d399" stroke-width="1.8" stroke-dasharray="3 2"/>
        
</svg>
