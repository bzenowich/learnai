<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 85" width="140" height="85" role="img" aria-label="Token & Embedding Grove Zone Emblem">
  <defs>
    <filter id="glow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow-2" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background Plaque -->
  <rect x="4" y="4" width="132" height="77" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="#f59e0b" stroke-width="1.8" filter="url(#glow-2)"/>
  <!-- Top Accent Indicator -->
  <rect x="14" y="4" width="112" height="3" rx="1.5" fill="#fbbf24"/>

  <!-- Thematic Zone Artwork -->
  
            <!-- Constellation Network & Floating Token Gems -->
            <line x1="35" y1="55" x2="65" y2="30" stroke="#f59e0b" stroke-width="1.8"/>
            <line x1="65" y1="30" x2="105" y2="40" stroke="#f59e0b" stroke-width="1.8"/>
            <line x1="35" y1="55" x2="75" y2="65" stroke="#f59e0b" stroke-width="1.8"/>
            <line x1="75" y1="65" x2="105" y2="40" stroke="#f59e0b" stroke-width="1.8"/>
            <!-- Glowing Token Nodes -->
            <circle cx="35" cy="55" r="7" fill="#fbbf24"/>
            <circle cx="65" cy="30" r="9" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
            <circle cx="75" cy="65" r="6" fill="#fbbf24"/>
            <circle cx="105" cy="40" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
            <!-- Floating Token Pill -->
            <rect x="50" y="12" width="40" height="15" rx="7.5" fill="rgba(15, 23, 42, 0.9)" stroke="#fbbf24" stroke-width="1.2"/>
            <text x="70" y="23" font-family="monospace" font-size="8" font-weight="bold" fill="#fbbf24" text-anchor="middle">"vector"</text>
        
</svg>
