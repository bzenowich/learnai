<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 85" width="140" height="85" role="img" aria-label="Transformer Attention Spire Zone Emblem">
  <defs>
    <filter id="glow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow-3" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background Plaque -->
  <rect x="4" y="4" width="132" height="77" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="#a855f7" stroke-width="1.8" filter="url(#glow-3)"/>
  <!-- Top Accent Indicator -->
  <rect x="14" y="4" width="112" height="3" rx="1.5" fill="#c084fc"/>

  <!-- Thematic Zone Artwork -->
  
            <!-- Crystalline Multi-Head Spire with Rainbow Light Beams -->
            <polygon points="65,12 78,35 65,72 52,35" fill="rgba(168, 85, 247, 0.4)" stroke="#c084fc" stroke-width="2"/>
            <polygon points="65,12 71,35 65,72" fill="rgba(192, 132, 252, 0.6)"/>
            <!-- Smaller flank crystals -->
            <polygon points="45,40 52,50 45,72 38,50" fill="rgba(168, 85, 247, 0.3)" stroke="#a855f7" stroke-width="1.5"/>
            <polygon points="85,40 92,50 85,72 78,50" fill="rgba(168, 85, 247, 0.3)" stroke="#a855f7" stroke-width="1.5"/>
            <!-- Radiating Attention Beams (Q, K, V) -->
            <line x1="65" y1="30" x2="115" y2="20" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
            <line x1="65" y1="30" x2="120" y2="35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
            <line x1="65" y1="30" x2="115" y2="50" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
            <circle cx="65" cy="30" r="4" fill="#ffffff"/>
        
</svg>
