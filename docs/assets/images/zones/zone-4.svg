<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 85" width="140" height="85" role="img" aria-label="Prompt & Context Canyon Zone Emblem">
  <defs>
    <filter id="glow-4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow-4" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#f472b6"/>
    </marker>
  </defs>

  <!-- Background Plaque -->
  <rect x="4" y="4" width="132" height="77" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="#ec4899" stroke-width="1.8" filter="url(#glow-4)"/>
  <!-- Top Accent Indicator -->
  <rect x="14" y="4" width="112" height="3" rx="1.5" fill="#f472b6"/>

  <!-- Thematic Zone Artwork -->
  
            <!-- Holographic Screen Panels & Prompt Window -->
            <rect x="25" y="22" width="45" height="32" rx="4" fill="rgba(15, 23, 42, 0.85)" stroke="#ec4899" stroke-width="1.8"/>
            <line x1="30" y1="30" x2="55" y2="30" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
            <line x1="30" y1="37" x2="62" y2="37" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="30" y1="44" x2="50" y2="44" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
            <!-- Overlapping System Prompt Card -->
            <rect x="55" y="32" width="50" height="35" rx="5" fill="rgba(15, 23, 42, 0.95)" stroke="#f472b6" stroke-width="2"/>
            <text x="63" y="45" font-family="monospace" font-size="7" font-weight="bold" fill="#ec4899">&gt; system:</text>
            <rect x="63" y="50" width="34" height="4" rx="1" fill="#f472b6" fill-opacity="0.6"/>
            <rect x="63" y="57" width="26" height="4" rx="1" fill="#f472b6" fill-opacity="0.4"/>
        
</svg>
