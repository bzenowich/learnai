<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 85" width="140" height="85" role="img" aria-label="The Autonomous Citadel Zone Emblem">
  <defs>
    <filter id="glow-7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow-7" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#ffd700"/>
    </marker>
  </defs>

  <!-- Background Plaque -->
  <rect x="4" y="4" width="132" height="77" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="#f43f5e" stroke-width="1.8" filter="url(#glow-7)"/>
  <!-- Top Accent Indicator -->
  <rect x="14" y="4" width="112" height="3" rx="1.5" fill="#ffd700"/>

  <!-- Thematic Zone Artwork -->
  
            <!-- Mountain Summit & Citadel Castle -->
            <!-- Mountain Peak Base -->
            <polygon points="20,72 65,48 110,72" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 63, 94, 0.5)" stroke-width="1.5"/>
            <!-- Castle Walls & Twin Spires -->
            <rect x="45" y="32" width="40" height="25" rx="2" fill="rgba(15, 23, 42, 0.95)" stroke="#f43f5e" stroke-width="2"/>
            <polygon points="40,32 46,14 52,32" fill="#f43f5e" stroke="#ffd700" stroke-width="1.5"/>
            <polygon points="78,32 84,14 90,32" fill="#f43f5e" stroke="#ffd700" stroke-width="1.5"/>
            <!-- Central Grand Spire -->
            <polygon points="57,28 65,8 73,28" fill="#ffd700" stroke="#ffffff" stroke-width="1.5"/>
            <!-- Citadel Crown Gateway -->
            <path d="M 59,57 A 6 6 0 0 1 71,57 L 71,57 L 59,57 Z" fill="#ffd700"/>
            <!-- Crown Sparkles -->
            <circle cx="65" cy="8" r="2.5" fill="#ffffff"/>
        
</svg>
