site_name: "How AI Works"
site_description: "A hands-on course on how AI works, from math to multi-agent systems."
site_author: "Brian Zenowich"
site_url: "https://bzenowich.github.io/learnai/"
repo_url: "https://github.com/bzenowich/learnai"
repo_name: "bzenowich/learnai"
edit_uri: "edit/main/docs/"

not_in_nav: |
  includes/*
  review-oct.md

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - toc.follow
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["docs"]
      auto_append:
        - includes/abbreviations.md

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js
  - javascripts/pyodide-runner.js
  - javascripts/progress.js
  - javascripts/candyland-decorations.js


